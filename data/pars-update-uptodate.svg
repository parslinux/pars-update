<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="shield_grad" x1="64" y1="20" x2="64" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="60%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="shield_border" x1="64" y1="20" x2="64" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="check_grad" x1="48" y1="52" x2="82" y2="76" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ecfdf5"/>
    </linearGradient>
    <filter id="shield_shadow" x="16" y="16" width="96" height="104" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#064e3b" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Sparkles -->
  <path d="M26 36 L28 42 L34 44 L28 46 L26 52 L24 46 L18 44 L24 42 Z" fill="#34d399" opacity="0.8"/>
  <path d="M102 32 L103.5 37 L108 38.5 L103.5 40 L102 45 L100.5 40 L96 38.5 L100.5 37 Z" fill="#38bdf8" opacity="0.75"/>
  <path d="M98 90 L99.5 94 L103 95 L99.5 96 L98 100 L96.5 96 L93 95 L96.5 94 Z" fill="#34d399" opacity="0.7"/>

  <!-- Shield Base -->
  <g filter="url(#shield_shadow)">
    <path d="M64 24 L96 36 C96 68, 80 88, 64 98 C48 88, 32 68, 32 36 Z" fill="url(#shield_grad)" stroke="url(#shield_border)" stroke-width="2.5"/>
  </g>

  <!-- Inner Soft Ring -->
