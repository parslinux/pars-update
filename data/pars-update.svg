<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Squircle Gradient -->
    <linearGradient id="pars_bg" x1="16" y1="12" x2="112" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="55%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>

    <!-- Inner Glow Border -->
    <linearGradient id="pars_border" x1="20" y1="16" x2="108" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#93c5fd" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Arrow Gradient -->
    <linearGradient id="pars_arrow1" x1="38" y1="32" x2="92" y2="86" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <linearGradient id="pars_shield_grad" x1="64" y1="44" x2="64" y2="88" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <!-- Shadow Filter -->
    <filter id="drop_shadow" x="0" y="4" width="128" height="124" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0b1e3b" flood-opacity="0.45"/>
    </filter>

    <filter id="glow" x="20" y="20" width="88" height="88" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base with Shadow -->
  <g filter="url(#drop_shadow)">
    <rect x="14" y="14" width="100" height="100" rx="26" fill="url(#pars_bg)"/>
    <rect x="14" y="14" width="100" height="100" rx="26" stroke="url(#pars_border)" stroke-width="2"/>
  </g>

  <!-- Central Sync Circular Arrow Ring -->
  <!-- Top-Right Clockwise Arrow Segment -->
  <path d="M64 30 C 79 30, 92 40, 95 54 L 88 56 C 85 45, 75 37, 64 37 C 55 37, 47 42, 42 50 L 51 53 L 32 60 L 32 40 L 39 45 C 45 36, 54 30, 64 30 Z"
        fill="url(#pars_arrow1)"/>

  <!-- Bottom-Left Clockwise Arrow Segment -->
  <path d="M64 98 C 49 98, 36 88, 33 74 L 40 72 C 43 83, 53 91, 64 91 C 73 91, 81 86, 86 78 L 77 75 L 96 68 L 96 88 L 89 83 C 83 92, 74 98, 64 98 Z"
        fill="url(#pars_arrow1)"/>

  <!-- Center Shield Badge with Upward Arrow -->
  <g filter="url(#glow)">
    <path d="M64 46 L76 51 C76 66, 68 76, 64 80 C60 76, 52 66, 52 51 Z" fill="url(#pars_shield_grad)" stroke="#38bdf8" stroke-width="1.5"/>
    <!-- Upward Chevron / Arrow -->
    <path d="M64 54 L58 60 L61.5 60 L61.5 70 L66.5 70 L66.5 60 L70 60 Z" fill="#ffffff"/>
  </g>
</svg>
